name: Feature request
description: Suggest an idea or enhancement
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem to solve
          description: >
              What are you trying to do, and what gets in the way? Concrete
              use cases beat abstract features.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: >
              What you imagine the API or behavior to look like, if you have
              an opinion.
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Other ways you could solve the same problem today.
