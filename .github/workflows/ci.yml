name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装项目与测试依赖
        run: python -m pip install ".[pyside6]" "pytest>=8,<9" "pytest-qt>=4.4,<5"
      - name: 运行离屏回归测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
