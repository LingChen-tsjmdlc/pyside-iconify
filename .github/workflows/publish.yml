name: Publish to PyPI

# Publishes through PyPI Trusted Publishing (OIDC); no API token is stored.
#
# Release flow: push a version tag (for example `git tag v1.0.0 && git push
# origin v1.0.0`). The workflow then
#   1. builds the package and checks the tag matches __version__,
#   2. waits for approval of the `pypi-release` environment,
#   3. publishes to PyPI,
#   4. creates the GitHub Release (notes generated, artifacts attached).
# The Release is only created after PyPI accepted the upload.
#
# Manual run ("Run workflow" in Actions): choose testpypi or pypi. No GitHub
# Release is created for manual runs.
#
# One-time setup (on pypi.org and test.pypi.org, Account -> Publishing ->
# "Add a new pending publisher"):
#   Project name:     pyside-iconify
#   Owner:            LingChen-tsjmdlc
#   Repository name:  pyside-iconify
#   Workflow name:    publish.yml
#   Environment name: pypi-release (PyPI) / testpypi-release (TestPyPI)
# Then create the same environments under the repository's
# Settings -> Environments.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            target:
                description: "Where to publish"
                type: choice
                required: true
                default: testpypi
                options:
                    - testpypi
                    - pypi

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4

            - name: Install Python
              run: uv python install 3.11

            - name: Check tag matches package version
              if: github.event_name == 'push'
              run: |
                  version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pyside_iconify/__init__.py)
                  tag="${GITHUB_REF_NAME#v}"
                  echo "package version: $version, tag: $tag"
                  test "$version" = "$tag"

            - name: Build wheel and sdist
              run: |
                  rm -rf dist/
                  uv build
                  ls -la dist/

            - name: Check artifacts
              run: |
                  python -m zipfile -l dist/*.whl | grep "pyside_iconify/py.typed"
                  python -m zipfile -l dist/*.whl | grep -E "\.workbuddy|\.vscode|__pycache__|\.pytest_cache" && exit 1 || true
                  tar -tzf dist/*.tar.gz | grep -E "\.workbuddy|\.vscode|__pycache__|\.pytest_cache" && exit 1 || true
                  uvx twine check dist/*

            - name: Upload dist
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    publish-testpypi:
        name: Publish to TestPyPI
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        environment:
            name: testpypi-release
            url: https://test.pypi.org/project/pyside-iconify/
        permissions:
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/

    publish-pypi:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        if: >-
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        environment:
            name: pypi-release
            url: https://pypi.org/project/pyside-iconify/
        permissions:
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1

    github-release:
        name: Create GitHub Release
        needs: publish-pypi
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        permissions:
            contents: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" dist/* \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "$GITHUB_REF_NAME" \
                      --generate-notes
