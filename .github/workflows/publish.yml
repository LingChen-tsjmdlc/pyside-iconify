name: Publish to PyPI

# Publishes through PyPI Trusted Publishing (OIDC); no API token is stored.
#
# Triggers:
#   - Publishing a GitHub Release  -> real PyPI
#   - "Run workflow" in Actions    -> choose testpypi or pypi
#
# One-time setup (on pypi.org and test.pypi.org, Account -> Publishing ->
# "Add a new pending publisher"):
#   Project name:     pyside-iconify
#   Owner:            LingChen-tsjmdlc
#   Repository name:  pyside-iconify
#   Workflow name:    publish.yml
#   Environment name: pypi-release (PyPI) / testpypi-release (TestPyPI)
# Then create the same two environments under the repository's
# Settings -> Environments.

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            target:
                description: "Where to publish"
                type: choice
                required: true
                default: testpypi
                options:
                    - testpypi
                    - pypi

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4

            - name: Install Python
              run: uv python install 3.11

            - name: Check release tag matches package version
              if: github.event_name == 'release'
              run: |
                  version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pyside_iconify/__init__.py)
                  tag="${GITHUB_REF_NAME#v}"
                  echo "package version: $version, release tag: $tag"
                  test "$version" = "$tag"

            - name: Build wheel and sdist
              run: |
                  rm -rf dist/
                  uv build
                  ls -la dist/

            - name: Check artifacts
              run: |
                  python -m zipfile -l dist/*.whl | grep "pyside_iconify/py.typed"
                  python -m zipfile -l dist/*.whl | grep -E "\.workbuddy|\.vscode|__pycache__|\.pytest_cache" && exit 1 || true
                  tar -tzf dist/*.tar.gz | grep -E "\.workbuddy|\.vscode|__pycache__|\.pytest_cache" && exit 1 || true
                  uvx twine check dist/*

            - name: Upload dist
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    publish-testpypi:
        name: Publish to TestPyPI
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        environment:
            name: testpypi-release
            url: https://test.pypi.org/project/pyside-iconify/
        permissions:
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/

    publish-pypi:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        if: >-
            github.event_name == 'release' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        environment:
            name: pypi-release
            url: https://pypi.org/project/pyside-iconify/
        permissions:
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
